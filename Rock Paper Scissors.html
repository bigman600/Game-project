<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: black;
        color: white;
        padding: 1px 200px;
        position: absolute;
        margin: 10px 50px;
    }
    h2 {
        padding-left: 250px;
    }
    h4 {
        padding-left: 20px;
        word-spacing: 165px;
    }
    .rock {
        background-color: transparent;
        border: 1px solid white;
        border-radius: 40px;
        border-color: white;
        font-size: 50px;
        margin-right: 140px;
        width: 80px;
        height: 80px;
    }
    .paper {
        background-color: transparent;
        border: 1px solid white;
        border-radius: 40px;
        border-color: white;
        font-size: 50px;
        margin-right: 140px;
        width: 80px;
        height: 80px;
    }
    .scissors {
        background-color: transparent;
        border: 1px solid white;
        border-radius: 40px;
        border-color: white;
        font-size: 50px;
        margin-right: 140px;
        width: 80px;
        height: 80px;

    }
    .result-p {
        font-size: 40px;
    }
    .move-p {
        font-size: 40px;
    }
    .scores-p {
        font-size: 40px;
    }

    .resetScore {
        background-color: rgb(27, 48, 27);
        color: white;
        border: 1px ;
        padding: 10px;
        margin-left: 300px;
        border-radius: 10px;
    }
</style>
<body>
    <h2>GAME</h2>
    <h4>Rock   Paper    Scissors </h4>
    <button  class="js-rock rock" onclick="
        pickComputerMove();
        playGame('✊');
    ">✊</button>
    <button class="js-paper paper" onclick="
        pickComputerMove();
        playGame('🖐️');
    ">🖐️</button>
    <button class="js-scissors scissors" onclick="
        pickComputerMove();
        playGame('✌️');
    ">✌️</button>
    <p class="js-result result-p"></p>
    <p class="js-move move-p"></p>
    <p class="js-scores scores-p"></p>
    <button class="js-resetScore resetScore" onclick="
        resetScore();
    ">Reset Score</button>
</body>
<script> 
let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        loose: 0,
        tie: 0
    };

    function resetScore() {
        score.wins = 0;
        score.loose = 0;
        score.tie = 0; 
        localStorage.removeItem('score');
        displayScore();
    }
    let computerMove = '';
    function pickComputerMove() {
        const randomNumber = Math.random();
        if(randomNumber > 0 && randomNumber < 1/3 ) {
            computerMove = '✊';
        } else if(randomNumber >= 1/3  && randomNumber < 2/3 ) {
            computerMove = '🖐️';
        } else if(randomNumber >= 2/3 && randomNumber < 1 ) {
            computerMove = '✌️';
        }       
    }        
    let result = '';
    function playGame(playerMove) {
        if(playerMove === '✊') {
            if(computerMove === '✊' ) {
                result = 'Tie.';
            } else if(computerMove === '🖐️') {
                result = 'You Loose.';
            } else if(computerMove === '✌️') {
                result = 'You Win.';
            } 
            
        } else if(playerMove === '🖐️') {
            if(computerMove === '✊' ) {
                result = 'You win';
            } else if(computerMove === '🖐️') {
                result = 'Tie.';
            } else if(computerMove === '✌️') {
                result = 'You Loose.';
            } 

        } else if(playerMove === '✌️') {
            if(computerMove === '✊' ) {
                result = 'You Loose.';
            } else if(computerMove === '🖐️') {
                result = 'You Win.';
            } else if(computerMove === '✌️') {
                result = 'Tie.';
            } 
        }

        if(result === 'You Win.'){
            score.wins += 1;
        } else if(result === 'You Loose.') {
            score.loose += 1;
        } else if(result === 'Tie.') {
            score.tie += 1;
        }
        localStorage.setItem('score', JSON.stringify(score));
        document.querySelector('.js-move').innerHTML = `You: ${playerMove}          Computer: ${computerMove}`;
        displayResult();
        displayScore();     
    }
    function displayScore() {
        document.querySelector('.js-scores').innerHTML = `wins: ${score.wins}  Loose: ${score.loose}  Tie: ${score.tie}`;
    }
    function displayResult() {
        document.querySelector('.js-result').innerHTML = ` ${result}`;
    }
    displayScore();



</script>
</html>
